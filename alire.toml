name = "df_imgui"
description = "Ada bindings to Dear ImGui via cimgui"
version = "0.1.0"
authors = ["The Dark Factory Ltd"]
maintainers = ["tony.gair@thedarkfactory.co.uk"]
maintainers-logins = ["tonygair"]
licenses = "MIT"
website = "https://github.com/the-dark-factory/imgui-ada"
tags = ["binding", "gui", "imgui", "cimgui"]
project-files = ["df_imgui.gpr"]
auto-gpr-with = false
notes = "cimgui + the Dear ImGui C++ it wraps are compiled by gprbuild via the companion cimgui.gpr (which df_imgui.gpr withs), so `alr build` is self-contained — no pre-build step, and consumers link the C++ library + runtime automatically. macOS: set SDKROOT if the toolchain needs the SDK headers."

[build-switches]
"*".style_checks = ["-gnaty"]

[available.'case(os)']
macos = true
linux = true
windows = false  # Untested; left off until verified.
